services:
  postgres:
    image: postgres:16-alpine
    container_name: root-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: root

    ports:
      - "5433:5432"

    volumes:
      - root_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d root"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  root_postgres_data: